name: MagpieRemote
options:
  bundleIdPrefix: app.magpie
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  MagpieRemote:
    type: application
    platform: iOS
    sources:
      - path: MagpieRemote
    info:
      path: MagpieRemote/Resources/Info.plist
      properties:
        CFBundleDisplayName: Magpie Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Magpie Remote 需要访问本地网络上的 magpie 网关以管理你的模型与账号。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.magpie.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
    scheme:
      testTargets:
        - MagpieRemoteTests
  MagpieRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagpieRemoteTests
    dependencies:
      - target: MagpieRemote
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MagpieRemoteTests/MagpieRemoteTests.entitlements
        GENERATE_INFOPLIST_FILE: true