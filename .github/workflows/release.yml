name: Build & Release IPA

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本号（如 1.0.0）'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          # 优先匹配并选用系统最新的 Xcode 版本
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build & Archive (Unsigned for Sideloading)
        run: |
          mkdir -p build/archive
          xcodebuild archive \
            -project MagpieRemote.xcodeproj \
            -scheme MagpieRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/archive/MagpieRemote.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r "build/archive/MagpieRemote.xcarchive/Products/Applications/MagpieRemote.app" build/ipa/Payload/
          cd build/ipa
          zip -r -q "../../MagpieRemote.ipa" Payload
          cd ../..
          shasum -a 256 MagpieRemote.ipa > MagpieRemote.ipa.sha256
          echo "=== IPA Build Complete ==="
          ls -lh MagpieRemote.ipa MagpieRemote.ipa.sha256
          cat MagpieRemote.ipa.sha256

      - name: Upload IPA Artifact (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: MagpieRemote-IPA
          path: |
            MagpieRemote.ipa
            MagpieRemote.ipa.sha256
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MagpieRemote.ipa
            MagpieRemote.ipa.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
