name: Build & Release IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本号（如 1.0.0，留空则使用 project.yml 中的版本）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    # iOS 26 SDK（Liquid Glass / GlassEffect / tabBarMinimizeBehavior）需要 Xcode 26+，
    # macos-15 自带 Xcode 16.4（iOS 18.5 SDK），必然编译失败。
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version_name }}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION:-<project.yml default>}"

      - name: Build & Archive (Unsigned for Sideloading)
        env:
          VERSION_OVERRIDE: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p build/archive
          VERSION_ARGS=()
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION_ARGS+=("MARKETING_VERSION=$VERSION_OVERRIDE")
          fi
          xcodebuild archive \
            -project MagpieRemote.xcodeproj \
            -scheme MagpieRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/archive/MagpieRemote.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}"

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -r "build/archive/MagpieRemote.xcarchive/Products/Applications/MagpieRemote.app" build/ipa/Payload/
          cd build/ipa
          zip -r -q "../../MagpieRemote.ipa" Payload
          cd ../..
          shasum -a 256 MagpieRemote.ipa > MagpieRemote.ipa.sha256
          echo "=== IPA Build Complete ==="
          ls -lh MagpieRemote.ipa MagpieRemote.ipa.sha256
          cat MagpieRemote.ipa.sha256

      - name: Upload IPA Artifact (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: MagpieRemote-IPA
          path: |
            MagpieRemote.ipa
            MagpieRemote.ipa.sha256
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MagpieRemote.ipa
            MagpieRemote.ipa.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
